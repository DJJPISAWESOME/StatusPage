<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heartbeat Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #040915;
      --surface: #0a1528;
      --surface-2: #101e35;
      --border: #223759;
      --text: #ecf2ff;
      --muted: #90a6cb;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
      --maint: #38bdf8;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 5%, rgba(56, 189, 248, .15), transparent 40%),
        radial-gradient(circle at 90% 0%, rgba(59,130,246,.12), transparent 38%),
        linear-gradient(180deg, #061026 0%, #040915 100%);
      overflow: hidden;
      padding: 12px;
    }

    .shell {
      height: calc(100vh - 24px);
      max-width: 1800px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .topbar, .footer {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(16,30,53,.9), rgba(10,21,40,.9));
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title { margin-right: auto; }
    .title h1 { margin: 0; font-size: clamp(1.1rem, 1vw + .8rem, 1.8rem); }

    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(6, 15, 31, .85);
      padding: 7px 12px;
      font-size: .8rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }

    .legend {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .legend .pill { font-size: .74rem; padding: 6px 10px; }

    .board-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(15,29,50,.6), rgba(8,17,33,.75));
      position: relative;
      overflow: hidden;
    }

    .board {
      position: absolute;
      inset: 0;
      padding: 12px;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr));
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: all .35s ease;
    }
    .board.active { opacity: 1; transform: none; pointer-events: auto; }

    .card {
      background: linear-gradient(170deg, rgba(18,33,58,.96), rgba(10,19,33,.95));
      border: 1px solid #29446d;
      border-left: 4px solid var(--ok);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: 0;
      overflow: hidden;
    }
    .card.warn { border-left-color: var(--warn); }
    .card.bad { border-left-color: var(--bad); }
    .card.maint { border-left-color: var(--maint); }

    .head { display: flex; justify-content: space-between; gap: 8px; }
    .name { margin: 0; font-size: clamp(1rem, .45vw + .85rem, 1.35rem); }

    .badge {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid;
      padding: 4px 7px;
      align-self: center;
    }
    .k-ok { color: var(--ok); background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.4); }
    .k-warn { color: var(--warn); background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.4); }
    .k-bad { color: var(--bad); background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.4); }
    .k-maint { color: var(--maint); background: rgba(56,189,248,.12); border-color: rgba(56,189,248,.4); }

    .meta { color: var(--muted); font-size: .74rem; margin: 7px 0; }

    .event {
      border: 1px solid #223a5b;
      border-radius: 9px;
      background: rgba(6,13,24,.66);
      padding: 8px;
      font-size: .76rem;
      overflow: hidden;
    }
    .event strong { font-size: .8rem; display: block; margin-bottom: 3px; }
    .event p {
      margin: 0;
      color: #c8d9fa;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .link { margin-top: 8px; color: #8cc8ff; text-decoration: none; font-size: .76rem; }
    .link:hover { text-decoration: underline; }

    .footer { justify-content: space-between; color: var(--muted); font-size: .82rem; }
    .pager { display: flex; gap: 6px; }
    .pager button {
      width: 28px; height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .pager button.active { background: #2563eb; border-color: #2563eb; }

    .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

    @media (max-width: 1100px) {
      .topbar { flex-wrap: wrap; }
      .title { width: 100%; }
      .footer { flex-direction: column; align-items: stretch; gap: 8px; }
      .pager { justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title"><h1>Heartbeat Command Center</h1></div>
      <div class="pill" id="overall"><span class="dot" style="color:var(--ok)"></span><strong>Operational</strong></div>
      <div class="legend" aria-label="status key">
        <span class="pill"><span class="dot" style="color:var(--ok)"></span>Operational</span>
        <span class="pill"><span class="dot" style="color:var(--warn)"></span>Degraded</span>
        <span class="pill"><span class="dot" style="color:var(--bad)"></span>Outage</span>
        <span class="pill"><span class="dot" style="color:var(--maint)"></span>Maintenance</span>
      </div>
      <div class="pill" id="clock"></div>
    </header>

    <section class="board-wrap" id="board-wrap">
      <div class="loading" id="loading">Loading…</div>
    </section>

    <footer class="footer">
      <div id="rotation">Auto-rotate 60s</div>
      <div class="pager" id="pager"></div>
      <div id="refresh">--</div>
    </footer>
  </main>

  <script>
    const services = [
      { name: 'i-Ready', statusApiUrl: 'https://i-ready.status.io/', incidentsApiUrl: 'https://i-ready.status.io/', homepageUrl: 'https://i-ready.status.io/', platform: 'statusio' },
      { name: 'HMH', statusApiUrl: 'https://status.hmhco.com/api/v2/status.json', incidentsApiUrl: 'https://status.hmhco.com/api/v2/incidents.json', homepageUrl: 'https://status.hmhco.com' },
      { name: 'Follett Software', statusApiUrl: 'https://status.follettsoftware.com/rest/systemstatus', homepageUrl: 'https://status.follettsoftware.com', platform: 'follett' },
      { name: 'IncidentIQ', statusApiUrl: 'https://status.incidentiq.com/api/v2/status.json', incidentsApiUrl: 'https://status.incidentiq.com/api/v2/incidents.json' },
      { name: 'Clever', statusApiUrl: 'https://status.clever.com/api/v2/status.json', incidentsApiUrl: 'https://status.clever.com/api/v2/incidents.json' },
      { name: 'Seesaw', statusApiUrl: 'https://status.seesaw.me/api/v2/status.json', incidentsApiUrl: 'https://status.seesaw.me/api/v2/incidents.json' },
      { name: 'Jamf', statusApiUrl: 'https://status.jamf.com/api/v2/status.json', incidentsApiUrl: 'https://status.jamf.com/api/v2/incidents.json' },
      { name: 'Meraki', statusApiUrl: 'https://status.meraki.net/api/v2/status.json', incidentsApiUrl: 'https://status.meraki.net/api/v2/incidents.json' },
      { name: 'Duo', statusApiUrl: 'https://status.duo.com/api/v2/status.json', incidentsApiUrl: 'https://status.duo.com/api/v2/incidents.json' },
      { name: 'Imagine Learning', statusApiUrl: 'https://status.imaginelearning.com/api/v2/status.json', incidentsApiUrl: 'https://status.imaginelearning.com/api/v2/incidents.json' },
      { name: 'Blackboard', statusApiUrl: 'https://status.blackboard.com/api/v2/status.json', incidentsApiUrl: 'https://status.blackboard.com/api/v2/incidents.json' },
      { name: 'FinalSite', statusApiUrl: 'https://status.finalsite.com/api/v2/status.json', incidentsApiUrl: 'https://status.finalsite.com/api/v2/incidents.json' },
      { name: 'Cloudflare', statusApiUrl: 'https://www.cloudflarestatus.com/api/v2/status.json', incidentsApiUrl: 'https://www.cloudflarestatus.com/api/v2/incidents.json' },
      { name: 'DNSFilter', statusApiUrl: 'https://status.dnsfilter.com/api/v2/status.json', incidentsApiUrl: 'https://status.dnsfilter.com/api/v2/incidents.json', homepageUrl: 'https://status.dnsfilter.com' },
      { name: 'SecureW2', statusApiUrl: 'https://status.securew2.com/api/v1/status', incidentsApiUrl: 'https://status.securew2.com/api/v1/notices', homepageUrl: 'https://status.securew2.com', platform: 'securew2' },
      { name: 'Adobe Creative Cloud', homepageUrl: 'https://status.adobe.com/cloud/creative_cloud', platform: 'adobe' }
    ];

    const REFRESH_MS = 120000;
    const ROTATE_MS = 60000;
    const CACHE_KEY = 'status-cache-v2';
    let currentPage = 0;
    let pages = [];
    let rotateTimer;

    const p = { major: 1, minor: 2, maintenance: 3, unknown: 4, none: 5 };
    const label = { none: 'Operational', minor: 'Degraded', major: 'Outage', maintenance: 'Maintenance', unknown: 'Unknown' };

    function grid() {
      const w = innerWidth;
      if (w < 900) return { cols: 1, rows: 3 };
      if (w < 1300) return { cols: 2, rows: 2 };
      if (w < 1700) return { cols: 3, rows: 2 };
      return { cols: 4, rows: 2 };
    }

    const c = (i) => i === 'major' ? ['bad', 'k-bad'] : i === 'minor' ? ['warn', 'k-warn'] : i === 'maintenance' ? ['maint', 'k-maint'] : ['', 'k-ok'];

    async function safeFetch(url, timeout = 9000) {
      const ctr = new AbortController();
      const t = setTimeout(() => ctr.abort(), timeout);
      try {
        const r = await fetch(url, { signal: ctr.signal, headers: { 'x-requested-with': 'fetch' } });
        if (!r.ok) throw new Error(String(r.status));
        return await r.text();
      } finally { clearTimeout(t); }
    }

    async function getJson(url) {
      const proxies = [u => u, u => 'https://corsproxy.io/?' + encodeURIComponent(u), u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)];
      let err;
      for (const wrap of proxies) {
        try { return JSON.parse((await safeFetch(wrap(url))).replace(/^\uFEFF/, '')); }
        catch (e) { err = e; }
      }
      throw err;
    }

    async function fetchService(svc) {
      try {
        if (svc.platform === 'adobe') return { ...svc, indicator: 'none', incidents: [], lastUpdated: new Date().toLocaleString() };
        if (svc.platform === 'statusio') {
          const html = await safeFetch(svc.statusApiUrl);
          const indicator = /All Systems Operational/i.test(html) ? 'none' : /Outage|Disruption|Investigating/i.test(html) ? 'major' : /Degraded/i.test(html) ? 'minor' : /Maintenance/i.test(html) ? 'maintenance' : 'unknown';
          return { ...svc, indicator, incidents: [], lastUpdated: new Date().toLocaleString() };
        }
        if (svc.platform === 'follett') {
          const d = await getJson(svc.statusApiUrl);
          const indicator = d.generalStatus === 'issues' ? 'minor' : d.generalStatus === 'maintenance' ? 'maintenance' : d.generalStatus && d.generalStatus !== 'ok' ? 'major' : 'none';
          const incidents = (d.statuses || []).filter(x => x.systemStatus && x.systemStatus !== 'ok').slice(0, 1).map(x => ({ name: x.systemName || 'Issue', description: (x.statusMessage || 'Issue detected').replace(/<[^>]+>/g, '') }));
          return { ...svc, indicator, incidents, lastUpdated: new Date().toLocaleString() };
        }
        if (svc.platform === 'securew2') {
          const [st, nt] = await Promise.all([getJson(svc.statusApiUrl), getJson(svc.incidentsApiUrl)]);
          const state = (st?.page?.state || '').toLowerCase();
          const indicator = state === 'degraded' ? 'minor' : state === 'under_maintenance' ? 'maintenance' : state && state !== 'operational' ? 'major' : 'none';
          const incidents = (nt?.notices || []).slice(0, 1).map(n => ({ name: n.subject || 'Notice', description: String(n.latest_update?.content || '').replace(/<[^>]+>/g, '').trim() || 'See status page.' }));
          return { ...svc, indicator, incidents, lastUpdated: new Date().toLocaleString() };
        }

        const [statusData, incidentData] = await Promise.all([getJson(svc.statusApiUrl), getJson(svc.incidentsApiUrl)]);
        let indicator = statusData?.status?.indicator || 'unknown';
        const active = (incidentData?.incidents || []).some(i => ['investigating', 'identified', 'monitoring'].includes((i.status || '').toLowerCase()));
        if (indicator === 'none' && active) indicator = 'minor';
        const incidents = (incidentData?.incidents || []).slice(0, 1).map(i => ({ name: i.name || 'Incident', description: (i.description || i.incident_updates?.[0]?.body || 'See status page.').replace(/<[^>]+>/g, '') }));
        return { ...svc, indicator, incidents, lastUpdated: new Date(statusData?.page?.updated_at || Date.now()).toLocaleString() };
      } catch {
        return { ...svc, indicator: 'unknown', incidents: [{ name: 'Unavailable', description: 'Live status fetch failed.' }], lastUpdated: '--' };
      }
    }

    function render(data) {
      const wrap = document.getElementById('board-wrap');
      const pager = document.getElementById('pager');
      const { cols, rows } = grid();
      const perPage = cols * rows;
      pages = Array.from({ length: Math.ceil(data.length / perPage) }, (_, i) => data.slice(i * perPage, (i + 1) * perPage));
      currentPage = Math.min(currentPage, pages.length - 1);

      wrap.querySelectorAll('.board').forEach(n => n.remove());
      pager.innerHTML = '';

      pages.forEach((group, i) => {
        const board = document.createElement('div');
        board.className = 'board' + (i === currentPage ? ' active' : '');
        board.style.setProperty('--cols', cols);
        board.style.setProperty('--rows', rows);

        group.forEach(s => {
          const [cardClass, badgeClass] = c(s.indicator);
          const evt = s.incidents[0];
          const card = document.createElement('article');
          card.className = `card ${cardClass}`;
          card.innerHTML = `
            <div class="head"><h2 class="name">${s.name}</h2><span class="badge ${badgeClass}">${label[s.indicator] || 'Unknown'}</span></div>
            <div class="meta">${s.lastUpdated}</div>
            <div class="event"><strong>${evt ? evt.name : 'No incident'}</strong><p>${evt ? evt.description : 'Running normally.'}</p></div>
            ${s.homepageUrl ? `<a class="link" href="${s.homepageUrl}" target="_blank" rel="noopener">Vendor status ↗</a>` : ''}
          `;
          board.appendChild(card);
        });

        wrap.appendChild(board);

        const b = document.createElement('button');
        b.textContent = String(i + 1);
        b.className = i === currentPage ? 'active' : '';
        b.onclick = () => { show(i); rotation(true); };
        pager.appendChild(b);
      });

      show(currentPage);
    }

    function show(i) {
      currentPage = i;
      document.querySelectorAll('.board').forEach((n, idx) => n.classList.toggle('active', idx === i));
      document.querySelectorAll('.pager button').forEach((n, idx) => n.classList.toggle('active', idx === i));
      document.getElementById('rotation').textContent = `Page ${i + 1}/${pages.length} • Auto-rotate 60s`;
    }

    function rotation(reset = false) {
      if (reset) clearInterval(rotateTimer);
      if (pages.length <= 1) return;
      rotateTimer = setInterval(() => show((currentPage + 1) % pages.length), ROTATE_MS);
    }

    function updateOverall(data) {
      const el = document.getElementById('overall');
      const bad = data.some(s => s.indicator === 'major');
      const warn = data.some(s => s.indicator === 'minor' || s.indicator === 'maintenance');
      el.innerHTML = bad
        ? '<span class="dot" style="color:var(--bad)"></span><strong>Outage</strong>'
        : warn
          ? '<span class="dot" style="color:var(--warn)"></span><strong>Degraded</strong>'
          : '<span class="dot" style="color:var(--ok)"></span><strong>Operational</strong>';
    }

    function now() {
      document.getElementById('clock').textContent = new Date().toLocaleString();
    }

    function cacheWrite(data) { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }
    function cacheRead() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; } }

    async function refresh() {
      document.getElementById('loading').style.display = 'grid';
      const data = await Promise.all(services.map(fetchService));
      data.sort((a, b) => (p[a.indicator] || 9) - (p[b.indicator] || 9));
      updateOverall(data);
      render(data);
      cacheWrite(data);
      document.getElementById('refresh').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      document.getElementById('loading').style.display = 'none';
      rotation(true);
    }

    function boot() {
      const cached = cacheRead();
      if (cached?.length) {
        updateOverall(cached);
        render(cached);
        document.getElementById('loading').style.display = 'none';
        rotation(true);
      }
      now();
      setInterval(now, 1000);
      refresh();
      setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
      addEventListener('resize', () => {
        const c = cacheRead();
        if (c?.length) {
          currentPage = 0;
          render(c);
          rotation(true);
        }
      });
    }

    boot();
  </script>
</body>
</html>
