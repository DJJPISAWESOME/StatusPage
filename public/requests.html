<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a song · Signal Local</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/requests.css"><script type="module" src="/requests.js"></script></head>
<body><main class="request-portal"><header class="request-heading"><a href="/" class="request-brand">SIGNAL <span>LOCAL</span></a><span class="request-tag">THE LISTENER’S CHOICE</span><h1>You pick the soundtrack.</h1><p>Add a YouTube or YouTube Music video to the Board’s shared queue.</p></header>
<section class="request-now" aria-labelledby="now-title"><span class="request-tag" id="now-title">ON THE BOARD</span><h2 id="request-current">Loading the queue…</h2><p id="request-online"></p></section>
<section class="request-compose" aria-labelledby="add-title"><h2 id="add-title">Request a song</h2><form id="request-form"><label for="request-query">Song, artist, or YouTube link</label><div class="request-input-row"><input id="request-query" type="text" maxlength="500" required placeholder="Search a song or paste a link" autocomplete="off"><button id="request-submit" type="submit">Search / Add</button></div></form><p id="request-feedback" role="status" aria-live="polite"></p><div id="request-results" class="request-results"></div></section>
<section class="request-up-next" aria-labelledby="queue-title"><div class="request-section-title"><h2 id="queue-title">Up next</h2><span id="request-count"></span></div><ol id="request-queue"></ol></section><footer>Videos play through YouTube. Some songs may be unavailable for embedded playback. <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">Open YouTube ↗</a></footer></main></body></html>
